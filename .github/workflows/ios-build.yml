name: Build iOS App
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm install-
        name: Grant Execute Permission to Binaries
        run: chmod +x node_modules/.bin/* 
     - name: Build Web Assets & Sync
        run: npx cap sync ios
      - name: Build iOS App via Xcode
        run: ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath App.xcarchive archive