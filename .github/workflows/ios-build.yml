name: Build iOS App
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm install
      - name: Build Web App
        run: npm run build --if-present
      - name: Grant Execute Permission to Binaries
        run: chmod +x node_modules/.bin/*
      - name: Sync Capacitor iOS
        run: npx cap sync ios
      - name: Install CocoaPods
        run: |
          cd ios/App
          pod repo update
          pod install --repo-update
        run: |
          cd ios/App
          pod install
      - name: Build iOS App via Xcode
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath App.xcarchive archive